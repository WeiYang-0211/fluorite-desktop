name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and verify
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Fluorite/Fluorite.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Restore must name the runtime identifier too, otherwise the assets
      # file has no net8.0-windows10.0.19041.0/win-x64 target and publish
      # fails with NETSDK1047.
      - name: Restore
        run: dotnet restore src/Fluorite/Fluorite.csproj -r win-x64

      - name: Build
        run: dotnet build src/Fluorite/Fluorite.csproj -c Release -r win-x64 --no-restore

      - name: Publish (framework-dependent)
        run: >
          dotnet publish src/Fluorite/Fluorite.csproj
          -c Release -r win-x64 --self-contained false
          --no-restore -o artifacts/framework-dependent

      # Guards against someone re-adding assets we cannot redistribute.
      - name: Verify no redistributable assets crept in
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Path src -Recurse -File -Include `
                  *.ttf, *.otf, *.jpg, *.jpeg, *.woff, *.woff2
          if ($bad) {
            Write-Error ("Found files that must not be committed:`n" +
                         ($bad.FullName -join "`n"))
            exit 1
          }
          Write-Host "Asset check passed."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluorite-framework-dependent
          path: artifacts/framework-dependent
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Fluorite/Fluorite.csproj -r win-x64

      # The release job runs on a fresh runner, so it has to pull the
      # framework-dependent output down before packaging.
      - name: Download framework-dependent build
        uses: actions/download-artifact@v4
        with:
          name: fluorite-framework-dependent
          path: artifacts/framework-dependent

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/Fluorite/Fluorite.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/self-contained

      - name: Package
        id: pack
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $sc  = "artifacts/Fluorite-$tag-win-x64-selfcontained.zip"
          $fd  = "artifacts/Fluorite-$tag-win-x64-framework-dependent.zip"

          Compress-Archive -Path "artifacts/self-contained/Fluorite.exe" `
                            -DestinationPath $sc -Force
          Compress-Archive -Path "artifacts/framework-dependent/*" `
                            -DestinationPath $fd -Force

          "sc=$sc" | Out-File -Append "$env:GITHUB_OUTPUT"
          "fd=$fd" | Out-File -Append "$env:GITHUB_OUTPUT"
          Get-ChildItem artifacts/*.zip | Format-Table Name, Length

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag  = $env:GITHUB_REF_NAME
          $sc   = "${{ steps.pack.outputs.sc }}"
          $fd   = "${{ steps.pack.outputs.fd }}"
          $scNm = Split-Path $sc -Leaf
          $fdNm = Split-Path $fd -Leaf
          $notes = @"
          ## Fluorite $tag

          A Windows app dock and launcher.

          | File | Notes |
          |---|---|
          | ``$scNm`` | Self-contained, run directly, no .NET needed |
          | ``$fdNm`` | Framework-dependent, needs the .NET 8 Desktop Runtime |

          Unzip and run ``Fluorite.exe``. Requires Windows 10 1809 or newer, x64.

          Licensed under Apache-2.0.
          "@
          gh release create $tag "$sc#Self-contained" "$fd#Framework-dependent" `
            --title "Fluorite $tag" --notes "$notes"